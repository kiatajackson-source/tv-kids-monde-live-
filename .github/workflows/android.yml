name: Build TV KIDS MONDE LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Verifier Android SDK
        run: sdkmanager --list_installed

      - name: Preparer le projet
        run: |
          mkdir -p output
          echo "Configuration Android preparee."
